<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ice Scout">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ice Scout</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--l1:#000;--l2:rgba(60,60,67,.6);--l3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);--bar:rgba(249,249,249,.78);
--ac:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--seg:#fff;--sh:0 1px 2px rgba(0,0,0,.04);--spring:cubic-bezier(.32,.72,0,1)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--l1:#fff;--l2:rgba(235,235,245,.6);--l3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--bar:rgba(22,22,24,.78);--ac:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--seg:#636366;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--l1);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.press{transition:transform .25s var(--spring),opacity .2s}.press:active{transform:scale(.97);opacity:.85}
/* nav */
.nav{position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top) 16px 0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-color:var(--sep)}
.navrow{height:44px;display:flex;align-items:center;justify-content:space-between}
.navrow .ttl{font-weight:600;opacity:0;transition:opacity .2s}.nav.scrolled .navrow .ttl{opacity:1}
.ib{width:36px;height:36px;display:grid;place-items:center;color:var(--ac);border-radius:18px}.ib svg{width:22px;height:22px}
.back{display:flex;align-items:center;gap:2px;color:var(--ac);font-size:17px;min-width:80px}.back svg{width:13px;height:21px}
h1{font:700 34px/41px -apple-system,"SF Pro Display",system-ui;letter-spacing:.01em;padding:2px 0 8px}
.sub{font-size:13px;color:var(--l2)}
/* views */
#views{position:relative}
.view{padding:8px 16px calc(100px + env(safe-area-inset-bottom));animation:fadein .35s var(--spring)}
.push{animation:pushin .45s var(--spring)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}@keyframes pushin{from{transform:translateX(40%);opacity:0}}
/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 16px;position:relative}
.seg button{flex:1;height:32px;font-size:13px;font-weight:500;border-radius:7px;position:relative;z-index:1;transition:color .2s}
.seg button.on{background:var(--seg);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--fill);font-size:15px;font-weight:500}.chip.on{background:var(--ac);color:#fff}
/* cards */
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.cap{font-size:13px;font-weight:600;color:var(--l2);text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px 16px}
.hero{font:700 48px/1.05 -apple-system,"SF Pro Display",system-ui;letter-spacing:-.03em}
.hl{font-size:15px;color:var(--l2);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}.m span{font-size:13px;color:var(--l2)}
.vsep{height:.5px;background:var(--sep);margin:16px 0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:3px 8px;border-radius:8px}
.pill.g{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}.pill.o{color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}.pill.r{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
/* funnel bars */
.fb{margin:12px 0}.fb .t{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}.fb .t span{color:var(--l2)}
.track{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}.track i{display:block;height:100%;border-radius:4px;background:var(--ac);transition:width .6s var(--spring)}
.chart{display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:8px}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;border-radius:3px;background:var(--ac);min-height:2px;transition:height .6s var(--spring)}.chart i.k{background:var(--green);margin-top:2px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--l3);margin-top:6px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--l2);margin-top:8px}.legend i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}
/* inset grouped list */
.list{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:24px;box-shadow:var(--sh)}
.li{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;width:100%;text-align:left}
.li+.li:before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.li.ico+.li.ico:before{left:60px}
.li:active{background:var(--fill)}.li .grow{flex:1;min-width:0}.li .t1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .t2{font-size:13px;color:var(--l2)}
.li .val{color:var(--l2);font-size:17px}.chev{width:8px;height:13px;color:var(--l3);flex:none}
.sq{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}.sq svg{width:18px;height:18px}
.foot{font-size:13px;color:var(--l2);margin:-16px 16px 24px}
/* search */
.search{display:flex;align-items:center;gap:6px;height:36px;background:var(--fill);border-radius:10px;padding:0 8px;margin-bottom:16px;color:var(--l2)}
.search svg{width:16px;height:16px;flex:none}.search input{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--l1);outline:none}
.empty{text-align:center;color:var(--l2);padding:48px 24px}.empty svg{width:48px;height:48px;color:var(--l3);margin-bottom:12px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 4px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--l2);position:relative;padding-bottom:16px;padding-bottom:2px}
.tab svg{width:26px;height:26px;transition:transform .3s var(--spring)}.tab.on{color:var(--ac)}.tab:active svg{transform:scale(.85)}
.badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 5px}
/* ptr + skeleton */
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--l2);transition:height .3s var(--spring)}.ptr svg{width:22px;height:22px}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--fill) 25%,color-mix(in srgb,var(--fill) 40%,transparent) 50%,var(--fill) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
/* lock */
#lock{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:var(--bg);transition:opacity .4s,transform .5s var(--spring)}
#lock.gone{opacity:0;transform:scale(1.08);pointer-events:none}
#lock img{width:84px;height:84px;border-radius:19px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-bottom:20px}
#lock h2{font:700 28px -apple-system,system-ui;margin-bottom:4px}#lock p{color:var(--l2);font-size:15px;margin-bottom:28px}
.field{width:100%;max-width:320px;height:50px;border-radius:12px;background:var(--card);border:0;padding:0 16px;font:inherit;color:var(--l1);text-align:center;letter-spacing:.1em;outline:none;box-shadow:var(--sh)}
.btn{width:100%;max-width:320px;height:50px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;margin-top:12px;display:grid;place-items:center}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#lerr{color:var(--red);font-size:13px;height:18px;margin-top:12px}
</style></head><body>
<div id="lock"><img src="apple-touch-icon.png" alt=""><h2>Ice Scout</h2><p>Enter passcode to unlock</p>
<input id="pw" class="field" type="password" autocomplete="current-password" placeholder="Passcode" onkeydown="if(event.key==='Enter')unlock()">
<button class="btn press" id="ubtn" onclick="unlock()">Unlock</button><div id="lerr"></div></div>
<header class="nav" id="nav"><div class="navrow"><div id="navL" style="min-width:80px"></div><div class="ttl" id="navT"></div><div style="min-width:80px;display:flex;justify-content:flex-end"><button class="ib press" onclick="refresh()" aria-label="Refresh" id="rbtn"></button></div></div><h1 id="big"></h1></header>
<div class="ptr" id="ptr"></div>
<main id="views"></main>
<nav class="tabs" id="tabs"></nav>
<script>
const I={ // SF-Symbols-style line icons
home:'<path d="M3 10.5 12 3l9 7.5M5.5 9v11h4.5v-6h4v6h4.5V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>',
funnel:'<path d="M3.5 4.5h17l-6.5 8v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
tests:'<path d="M9 3.5h6M10 3.5v6L4.8 18.3A1.5 1.5 0 0 0 6.1 20.5h11.8a1.5 1.5 0 0 0 1.3-2.2L14 9.5v-6M7.5 14.5h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
bell:'<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
chev:'<path d="m1.5 1.5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
back:'<path d="M11 1.5 2 10.5l9 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
warn:'<path d="M12 4 2.5 20h19zM12 10v4.5M12 17.5v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>',
lock:'<rect x="5" y="11" width="14" height="9.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/>',
clock:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
store:'<path d="M4 9.5h16M5 9.5V20h14V9.5M3.5 9.5 5.5 4h13l2 5.5M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
check:'<path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
tag:'<path d="M3.5 12.5V4h8.5l8.5 8.5-8.5 8.5zM8 8.5v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'};
const svg=(k,vb='0 0 24 24')=>`<svg ${k==='chev'?'class="chev"':''} viewBox="${k==='chev'?'0 0 8 13':k==='back'?'0 0 13 21':vb}">${I[k]}</svg>`;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(e,p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},k,b64(e.ct))))}
const tap=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
let D=null,ST={tab:'home',store:'all',per:'30d',stack:[],q:'',fs:'all'};
const TABS=[['home','Overview','home'],['funnel','Funnel','funnel'],['tests','Split Tests','tests'],['search','Search','search'],['alerts','Alerts','bell']];
const STORES=[['all','Both'],['stpeters','SNOCRAVE'],['ellisville','SNOFIX']],PERS=[['today','Today'],['7d','7D'],['30d','30D'],['ytd','YTD'],['all','All']];
const PL={today:'today','7d':'last 7 days','30d':'last 30 days',ytd:'year to date',all:'all time'};
const n=v=>v==null?'—':Number(v).toLocaleString(),$=v=>v==null?'—':'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:v>=1000?0:2,maximumFractionDigits:v>=1000?0:2}),
 pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'—',ts=s=>s?`20${s.slice(0,2)}-${s.slice(2,4)}-${s.slice(4,6)} ${s.slice(7,9)}:${s.slice(9,11)}`:'—';
async function load(p){const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});return decrypt(await r.json(),p)}
async function unlock(){const p=document.getElementById('pw').value,b=document.getElementById('ubtn');b.innerHTML=`<svg class="spin" viewBox="0 0 24 24" width="22">${I.refresh}</svg>`;
 try{D=await load(p);localStorage.setItem('ice_pw',p);opened()}catch(e){tap();b.textContent='Unlock';document.getElementById('lerr').textContent='Incorrect passcode';const f=document.getElementById('pw');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');f.value=''}}
function opened(){document.getElementById('lock').classList.add('gone');render()}
function lockApp(){localStorage.removeItem('ice_pw');location.reload()}
async function refresh(){tap();const b=document.getElementById('rbtn');b.querySelector('svg')?.classList.add('spin');skeleton();
 try{if(!window.PREVIEW_DATA)D=await load(localStorage.getItem('ice_pw'));}catch(e){}setTimeout(()=>render(),window.PREVIEW_DATA?500:0)}
function skeleton(){document.getElementById('views').innerHTML=`<div class="view"><div class="sk" style="height:36px;margin-bottom:16px"></div>${[150,110,200].map(h=>`<div class="sk" style="height:${h}px;margin-bottom:16px;border-radius:16px"></div>`).join('')}</div>`}
const seg=(key,opts)=>`<div class="seg">${opts.map(([k,l])=>`<button class="${ST[key]==k?'on':''}" onclick="tap();ST.${key}='${k}';render(true)">${l}</button>`).join('')}</div>`;
const li=(o)=>`<button class="li press ${o.ic?'ico':''}" ${o.on?`onclick="${o.on}"`:''}>${o.ic?`<span class="sq" style="background:${o.c||'var(--ac)'}">${svg(o.ic)}</span>`:''}<span class="grow"><div class="t1">${o.t}</div>${o.s?`<div class="t2">${o.s}</div>`:''}</span>${o.v!=null?`<span class="val num">${o.v}</span>`:''}${o.on?svg('chev'):''}</button>`;
function go(tab){tap();ST.tab=tab;ST.stack=[];window.scrollTo(0,0);render()}
function push(v){tap();ST.stack.push(v);window.scrollTo(0,0);render()}
function pop(){tap();ST.stack.pop();render()}
function render(keep){if(!D)return;const top=ST.stack[ST.stack.length-1];let title,html;
 if(top){[title,html]=VIEWS[top.v](top)}else{[title,html]=VIEWS[ST.tab]()}
 document.getElementById('big').textContent=title;document.getElementById('navT').textContent=title;
 document.getElementById('navL').innerHTML=top?`<button class="back press" onclick="pop()">${svg('back')}${ST.stack.length>1?'Back':TABS.find(t=>t[0]==ST.tab)[1]}</button>`:'';
 document.getElementById('rbtn').innerHTML=svg('refresh');
 document.getElementById('views').innerHTML=`<div class="view ${top&&!keep?'push':''}" style="${keep?'animation:none':''}">${html}</div>`;
 const al=D.stores.all.alerts.length;document.getElementById('tabs').innerHTML=TABS.map(([k,l,i])=>`<button class="tab ${ST.tab==k?'on':''}" onclick="go('${k}')">${svg(i)}${k=='alerts'&&al?`<span class="badge">${al}</span>`:''}<span>${l}</span></button>`).join('');
 if(ST.tab=='search'&&!top){const q=document.getElementById('q');if(q&&keep){q.focus();q.setSelectionRange(99,99)}}}
const health=s=>s.alerts.length?`<span class="pill o">${svg('warn')}${s.alerts.length} alert${s.alerts.length>1?'s':''}</span>`:`<span class="pill g">Healthy</span>`;
const VIEWS={
home(){const s=D.stores[ST.store],c=s.customers[ST.per],f=s.funnel[ST.per],e=s.econ;
 return['Overview',`${seg('store',STORES)}${seg('per',PERS)}
 <div class="card press" onclick="go('funnel')"><div class="sub">Coupon revenue · ${PL[ST.per]}</div><div class="hero num">${$(c.revenue)}</div>
 <div class="hl">${n(c.redeemers)} redemptions · AOV ${$(c.aov)}</div><div class="vsep"></div>
 <div class="row3"><div class="m"><b class="num">${n(f.shown)}</b><span>Shown</span></div><div class="m"><b class="num">${n(f.claimed)}</b><span>Claimed</span></div><div class="m"><b class="num">${n(f.redeemed)}</b><span>Redeemed</span></div></div></div>
 <div class="card"><div class="row2"><div class="m"><b class="num">${n(c.new)}</b><span>New customers</span></div><div class="m"><b class="num">${n(c.returning)}</b><span>Returning</span></div></div></div>
 <div class="cap">Ad performance · YTD</div><div class="card"><div class="row3"><div class="m"><b class="num">${e.roas_ytd??'—'}×</b><span>ROAS</span></div><div class="m"><b class="num">${$(e.cpa_ytd)}</b><span>CPA</span></div><div class="m"><b class="num">${$(e.cpa_new_ytd)}</b><span>CPA new</span></div></div>
 <div class="vsep"></div><div class="sub">Spend ${$(e.spend_ytd_typed)} (typed-in YTD value from the Dashboard tab)</div></div>
 <div class="cap">Stores</div><div class="list">${['stpeters','ellisville'].map(k=>{const x=D.stores[k];return li({ic:'store',c:k=='stpeters'?'#007aff':'#5856d6',t:x.name+(k=='stpeters'?' · SNOCRAVE':' · SNOFIX'),s:`${n(x.customers[ST.per].redeemers)} redemptions · ${$(x.customers[ST.per].revenue)}`,on:`push({v:'store',k:'${k}'})`})}).join('')}</div>
 <div class="foot">Updated ${D.generated.replace('T',' ')} CT · pull down or tap ↻ to refresh</div>`]},
store(o){const s=D.stores[o.k],f=s.funnel[ST.per],c=s.customers[ST.per];
 return[s.name,`${seg('per',PERS)}<div class="card"><div class="sub">Revenue · ${PL[ST.per]}</div><div class="hero num">${$(c.revenue)}</div><div class="hl">${health(s)}</div></div>
 <div class="list">${li({t:'Shown',v:n(f.shown)})}${li({t:'Claimed',v:`${n(f.claimed)} · ${pct(f.claimed,f.shown)}`})}${li({t:'Redeemed',v:`${n(f.redeemed)} · ${pct(f.redeemed,f.claimed)}`})}</div>
 <div class="list">${li({t:'New customers',v:n(c.new)})}${li({t:'Returning',v:n(c.returning)})}${li({t:'Avg order value',v:$(c.aov)})}</div>
 <div class="list">${li({t:'Codes left in pool',v:n(s.pool)})}${li({t:'Last claim',v:s.days_since_claim+'d ago'})}${li({t:'Last redemption',v:s.days_since_redeem+'d ago'})}${li({t:'ROAS (YTD)',v:(s.econ.roas_ytd??'—')+'×'})}</div>
 <div class="list">${li({ic:'tests',c:'#af52de',t:'Split tests',on:`ST.store='${o.k}';go('tests')`})}${li({ic:'bell',c:'#ff9500',t:'Alerts',v:s.alerts.length,on:`go('alerts')`})}</div>`]},
funnel(){const s=D.stores[ST.store],f=s.funnel[ST.per],w=s.weeks,mx=Math.max(1,...w.map(x=>x.shown));
 const bar=(l,v,base,c)=>`<div class="fb"><div class="t"><b>${l}</b><span class="num">${n(v)}${base!=null?` · ${pct(v,base)}`:''}</span></div><div class="track"><i style="width:${f.shown?Math.max(1,100*v/f.shown):0}%;${c?'background:'+c:''}"></i></div></div>`;
 return['Funnel',`${seg('store',STORES)}${seg('per',PERS)}
 <div class="card"><div class="sub">Redeemed of shown · ${PL[ST.per]}</div><div class="hero num">${pct(f.redeemed,f.shown)}</div>
 ${bar('Shown',f.shown)}${bar('Claimed',f.claimed,f.shown,'#5ac8fa')}${bar('Redeemed',f.redeemed,f.claimed,'var(--green)')}</div>
 <div class="cap">Weekly trend · 12 weeks</div><div class="card"><div class="chart">${w.map(x=>`<div><i style="height:${100*x.shown/mx}%"></i><i class="k" style="height:${Math.max(2,100*x.redeemed/mx*5)}px"></i></div>`).join('')}</div>
 <div class="axis"><span>${w[0].week.slice(5)}</span><span>${w[w.length-1].week.slice(5)}</span></div><div class="legend"><span><i style="background:var(--ac)"></i>Shown</span><span><i style="background:var(--green)"></i>Redeemed</span></div></div>
 <div class="cap">By week</div><div class="list">${w.slice().reverse().slice(0,8).map(x=>li({t:'Week of '+x.week.slice(5),s:`${n(x.claimed)} claimed · ${n(x.redeemed)} redeemed`,v:n(x.shown)})).join('')}</div>`]},
tests(){const ks=ST.store=='all'?['stpeters','ellisville']:[ST.store];
 return['Split Tests',`${seg('store',STORES)}${ks.map(k=>{const sp=D.stores[k].splits;const best=sp.filter(x=>x.ok&&x.label!=='(none)').sort((a,b)=>b.redeemed/b.shown-a.redeemed/a.shown)[0];
 return`<div class="cap">${D.stores[k].name}</div><div class="list">${sp.map(x=>li({ic:'tag',c:x===best?'var(--green)':x.ok?'#8e8e93':'#c7c7cc',t:x.label,s:x.ok?`${pct(x.claimed,x.shown)} claim · ${n(x.shown)} shown${x===best?' · Leader':''}`:`Low sample (${n(x.shown)} shown)`,v:pct(x.redeemed,x.shown),on:`push({v:'split',k:'${k}',l:${JSON.stringify(x.label).replace(/"/g,'&quot;')}})`})).join('')}</div>`}).join('')}
 <div class="foot">Ranked by redeemed ÷ shown, all time. Labels under ${D.min_sample} shown are greyed out.</div>`]},
split(o){const x=D.stores[o.k].splits.find(s=>s.label==o.l);
 return[x.label,`<div class="card"><div class="sub">${D.stores[o.k].name} · redeemed of shown</div><div class="hero num">${pct(x.redeemed,x.shown)}</div><div class="hl">${x.ok?'<span class="pill g">Sample OK</span>':`<span class="pill o">Below ${D.min_sample} shown</span>`}</div></div>
 <div class="list">${li({t:'Shown',v:n(x.shown)})}${li({t:'Claimed',v:`${n(x.claimed)} · ${pct(x.claimed,x.shown)}`})}${li({t:'Redeemed',v:`${n(x.redeemed)} · ${pct(x.redeemed,x.claimed)}`})}</div>`]},
search(){const q=ST.q.trim().toUpperCase();let r=[];
 if(q.length>=2)r=D.codes.filter(c=>(ST.fs=='all'||c[1]==ST.fs)&&c[0].includes(q)).slice(0,50);
 const st=c=>c[4]?['Redeemed','var(--green)']:['Claimed','#5ac8fa'];
 return['Search',`<div class="search">${svg('search')}<input id="q" placeholder="Code, e.g. 22DC" value="${ST.q}" autocapitalize="characters" autocomplete="off" oninput="ST.q=this.value;render(true)"></div>
 <div class="chips">${STORES.map(([k,l])=>`<button class="chip press ${ST.fs==k?'on':''}" onclick="tap();ST.fs='${k}';render(true)">${l}</button>`).join('')}</div>
 ${q.length<2?`<div class="empty">${svg('search')}<div>Search ${n(D.codes.length)} claimed &amp; redeemed codes</div></div>`:r.length?`<div class="list">${r.map(c=>{const[s,col]=st(c);return li({ic:c[4]?'check':'tag',c:col,t:c[0],s:`${s} · ${D.stores[c[1]].name}`,on:`push({v:'code',c:'${c[0]}'})`})}).join('')}</div>`:`<div class="empty">No matching codes</div>`}
 <div class="foot">Search covers codes only; no customer names or contact details are stored in the app.</div>`]},
code(o){const c=D.codes.find(x=>x[0]==o.c);
 return[c[0],`<div class="card"><div class="sub">${D.stores[c[1]].name}</div><div class="hero" style="font-size:34px">${c[4]?'Redeemed':'Claimed'}</div><div class="hl">${c[5]||'No split label'}</div></div>
 <div class="list">${li({ic:'clock',c:'#8e8e93',t:'Shown',v:ts(c[2])})}${li({ic:'clock',c:'#5ac8fa',t:'Claimed',v:ts(c[3])})}${li({ic:'check',c:'var(--green)',t:'Redeemed',v:ts(c[4])})}</div>
 ${c[4]?`<div class="list">${li({t:'Order total',v:$(c[6])})}${li({t:'Customer type',v:c[7]||'—'})}</div>`:''}`]},
alerts(){const ks=['stpeters','ellisville'];const all=ks.flatMap(k=>D.stores[k].alerts.map(a=>[k,a]));
 return['Alerts',`${all.length?`<div class="list">${all.map(([k,a])=>li({ic:'warn',c:/Pool|Mismatch/.test(a)?'var(--red)':'var(--orange)',t:a,s:D.stores[k].name,on:`push({v:'store',k:'${k}'})`})).join('')}</div>`:`<div class="empty">${svg('check')}<div>All clear</div></div>`}
 <div class="cap">Health</div><div class="list">${ks.map(k=>li({ic:'store',c:'#8e8e93',t:D.stores[k].name,s:`Pool ${n(D.stores[k].pool)} · claim ${D.stores[k].days_since_claim}d · redeem ${D.stores[k].days_since_redeem}d ago`})).join('')}</div>
 <div class="cap">Settings</div><div class="list">${li({ic:'clock',c:'#34c759',t:'Data updated',v:D.generated.slice(5,16).replace('T',' ')})}${li({ic:'refresh',c:'#007aff',t:'Refresh now',on:'refresh()'})}${li({ic:'lock',c:'#ff3b30',t:'Lock Ice Scout',on:'lockApp()'})}</div>
 <div class="foot">Data is end-to-end encrypted and decrypted only on this device. Alert rules: pool &lt; 1,000 · shown but 0 claims in 7d · 0 redemptions in 7d · count mismatch &gt; 5%.</div>`]}
};
// nav shadow + pull to refresh
addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',scrollY>30),{passive:true});
let y0=null;const ptr=document.getElementById('ptr');
addEventListener('touchstart',e=>{y0=scrollY<=0?e.touches[0].clientY:null},{passive:true});
addEventListener('touchmove',e=>{if(y0==null)return;const d=Math.min(80,(e.touches[0].clientY-y0)*.5);if(d>0){ptr.style.transition='none';ptr.style.height=d+'px';ptr.innerHTML=svg('refresh');ptr.firstChild.style.transform=`rotate(${d*4}deg)`}},{passive:true});
addEventListener('touchend',()=>{if(y0==null)return;const h=parseFloat(ptr.style.height)||0;ptr.style.transition='';y0=null;
 if(h>60){ptr.style.height='48px';ptr.firstChild.classList.add('spin');refresh().then(()=>ptr.style.height='0')}else ptr.style.height='0'});
if(window.PREVIEW_DATA){D=PREVIEW_DATA;const u=new URLSearchParams(location.search);ST.tab=u.get('tab')||'home';if(u.get('q'))ST.q=u.get('q');if(u.get('push'))ST.stack=[JSON.parse(u.get('push'))];opened();if(u.get('lock'))document.getElementById('lock').classList.remove('gone')}
else{const p=localStorage.getItem('ice_pw');if(p){document.getElementById('pw').value=p;unlock()}}
if('serviceWorker' in navigator&&!window.PREVIEW_DATA)navigator.serviceWorker.register('sw.js');
</script></body></html>
