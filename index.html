<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ice Scout">
<meta name="theme-color" content="#0b0b0d"><meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<title>Ice Scout</title>
<style>
:root{--bg:#0b0b0d;--card:#111114;--card2:#16161a;--l1:#ededef;--l2:#8a8a93;--l3:#55555c;--sep:#1f1f23;--fill:#1a1a1e;--bar:rgba(11,11,13,.72);
--ac:#7c8cff;--green:#3fb950;--orange:#d29922;--red:#f85149;--seg:#26262b;--spring:cubic-bezier(.32,.72,0,1);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--l1);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Inter","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.press{transition:transform .18s var(--spring),background .15s,border-color .15s}.press:active{transform:scale(.98)}
.nav{position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top) 12px 0;background:var(--bar);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.nav.scrolled{border-color:var(--sep)}
.navrow{height:36px;display:flex;align-items:center;justify-content:space-between}
.navrow .ttl{font-weight:600;font-size:13px;opacity:0;transition:opacity .2s}.nav.scrolled .navrow .ttl{opacity:1}
.ib{width:28px;height:28px;display:grid;place-items:center;color:var(--l2);border-radius:7px;border:1px solid var(--sep)}.ib svg{width:15px;height:15px}.ib:active{background:var(--fill)}
.back{display:flex;align-items:center;gap:4px;color:var(--l2);font-size:13px;min-width:70px}.back svg{width:7px;height:12px}
h1{font:600 20px/26px -apple-system,"Inter",system-ui;letter-spacing:-.02em;padding:0 0 10px}
.sub{font-size:11px;color:var(--l2)}
.view{padding:4px 12px calc(76px + env(safe-area-inset-bottom));animation:fadein .28s var(--spring)}
.push{animation:pushin .32s var(--spring)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}@keyframes pushin{from{transform:translateX(24px);opacity:0}}
.seg{display:flex;background:var(--card);border:1px solid var(--sep);border-radius:8px;padding:2px;margin:0 0 8px}
.seg button{flex:1;height:24px;font-size:11px;font-weight:500;color:var(--l2);border-radius:6px;transition:color .15s,background .15s}
.seg button.on{background:var(--seg);color:var(--l1)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 10px;padding:0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:24px;padding:0 10px;border-radius:6px;border:1px solid var(--sep);background:var(--card);font-size:11px;font-weight:500;color:var(--l2)}.chip.on{color:var(--l1);border-color:#34343b;background:var(--seg)}
.card{background:var(--card);border:1px solid var(--sep);border-radius:10px;padding:12px;margin-bottom:10px}
.cap{font-size:10.5px;font-weight:600;color:var(--l3);text-transform:uppercase;letter-spacing:.08em;margin:14px 2px 6px}
.hero{font:600 22px/1.15 -apple-system,"Inter",system-ui;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hl{font-size:11px;color:var(--l2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sep);border:1px solid var(--sep);border-radius:10px;overflow:hidden;margin-bottom:10px}
.tiles.c2{grid-template-columns:1fr 1fr}
.tile{background:var(--card);padding:10px;min-width:0;text-align:left}.tile:active{background:var(--card2)}
.tile .k{font-size:11px;color:var(--l2);display:flex;justify-content:space-between;align-items:center;gap:4px}
.tile .v{font-size:18px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .s{font-size:11px;color:var(--l3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile svg.spk{display:block;width:100%;height:18px;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m b{display:block;font-size:18px;font-weight:600}.m span{font-size:11px;color:var(--l2)}
.vsep{height:1px;background:var(--sep);margin:10px -12px}
.pill,.d{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.pill svg{width:10px;height:10px}
.pill.g,.d.up{color:var(--green);background:rgba(63,185,80,.12)}.pill.o{color:var(--orange);background:rgba(210,153,34,.12)}.pill.r,.d.dn{color:var(--red);background:rgba(248,81,73,.12)}.d.eq{color:var(--l2);background:var(--fill)}
.fb{margin:10px 0 0}.fb .t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.fb .t b{font-weight:500}.fb .t span{color:var(--l2)}
.track{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}.track i{display:block;height:100%;border-radius:2px;background:var(--ac);transition:width .5s var(--spring)}
.chart{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:4px}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;border-radius:2px;background:var(--ac);opacity:.85;min-height:1px}.chart i.k{background:var(--green);margin-top:1px}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--l3);margin-top:4px}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--l2);margin-top:6px}.legend i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:5px}
.list{background:var(--card);border:1px solid var(--sep);border-radius:10px;overflow:hidden;margin-bottom:10px}
.li{display:flex;align-items:center;gap:10px;min-height:36px;padding:8px 10px;position:relative;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--sep)}
.li:active{background:var(--card2)}.li .grow{flex:1;min-width:0}.li .t1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .t2{font-size:11px;color:var(--l2)}
.li .val{color:var(--l1);font-size:12px;font-variant-numeric:tabular-nums}.chev{width:6px;height:10px;color:var(--l3);flex:none}
.sq{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--l2);background:var(--fill);border:1px solid var(--sep);flex:none}.sq svg{width:13px;height:13px}
.foot{font-size:11px;color:var(--l3);margin:2px 2px 14px}
table.t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.t th{font-size:10.5px;font-weight:500;color:var(--l3);text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:7px 10px;border-bottom:1px solid var(--sep)}
.t td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--sep)}.t tr:last-child td{border-bottom:0}.t th:first-child,.t td:first-child{text-align:left}
.t td.mu{color:var(--l2)}
.search{display:flex;align-items:center;gap:6px;height:30px;background:var(--card);border:1px solid var(--sep);border-radius:8px;padding:0 8px;margin-bottom:8px;color:var(--l3)}
.search:focus-within{border-color:#3a3a42}
.search svg{width:13px;height:13px;flex:none}.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;transform:scale(.8125);transform-origin:left;width:123%;color:var(--l1);outline:none}
.empty{text-align:center;color:var(--l3);padding:40px 24px;font-size:12px}.empty svg{width:28px;height:28px;margin-bottom:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;padding:5px 4px calc(env(safe-area-inset-bottom) + 2px);background:var(--bar);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--sep)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9.5px;font-weight:500;color:var(--l3);position:relative;padding:2px 0}
.tab svg{width:19px;height:19px;transition:transform .2s var(--spring)}.tab.on{color:var(--l1)}.tab:active svg{transform:scale(.88)}
.badge{position:absolute;top:-1px;left:calc(50% + 5px);min-width:14px;height:14px;border-radius:7px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--l3);transition:height .3s var(--spring)}.ptr svg{width:16px;height:16px}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px;border:1px solid var(--sep)}
@keyframes sh{to{background-position:-200% 0}}
#lock{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;background:radial-gradient(120% 60% at 50% 0%,#15151c 0%,var(--bg) 60%);transition:opacity .35s,transform .4s var(--spring)}
#lock.gone{opacity:0;transform:scale(1.04);pointer-events:none}
#lock img{width:64px;height:64px;border-radius:14.3px;border:1px solid var(--sep);margin-bottom:14px}
#lock h2{font:600 17px -apple-system,"Inter",system-ui;margin-bottom:2px;letter-spacing:-.01em}#lock p{color:var(--l2);font-size:12px;margin-bottom:20px}
.field{width:100%;max-width:280px;height:36px;border-radius:8px;background:var(--card);border:1px solid var(--sep);padding:0 12px;font:inherit;font-size:16px;color:var(--l1);text-align:center;letter-spacing:.08em;outline:none}
.field:focus{border-color:#3a3a42}
.btn{width:100%;max-width:280px;height:34px;border-radius:8px;background:var(--l1);color:#0b0b0d;font-weight:600;font-size:13px;margin-top:8px;display:grid;place-items:center}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#lerr{color:var(--red);font-size:11px;height:16px;margin-top:10px}
</style></head><body>
<div id="lock"><img src="icon-512.png?v=5" alt=""><h2>Ice Scout</h2><p>Enter passcode to unlock</p>
<input id="pw" class="field" type="password" autocomplete="current-password" placeholder="Passcode" onkeydown="if(event.key==='Enter')unlock()">
<button class="btn press" id="ubtn" onclick="unlock()">Unlock</button><div id="lerr"></div></div>
<header class="nav" id="nav"><div class="navrow"><div id="navL" style="min-width:80px"></div><div class="ttl" id="navT"></div><div style="min-width:80px;display:flex;justify-content:flex-end"><button class="ib press" onclick="refresh()" aria-label="Refresh" id="rbtn"></button></div></div><h1 id="big"></h1></header>
<div class="ptr" id="ptr"></div>
<main id="views"></main>
<nav class="tabs" id="tabs"></nav>
<script>
const I={ // SF-Symbols-style line icons
home:'<path d="M3 10.5 12 3l9 7.5M5.5 9v11h4.5v-6h4v6h4.5V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>',
funnel:'<path d="M3.5 4.5h17l-6.5 8v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
tests:'<path d="M9 3.5h6M10 3.5v6L4.8 18.3A1.5 1.5 0 0 0 6.1 20.5h11.8a1.5 1.5 0 0 0 1.3-2.2L14 9.5v-6M7.5 14.5h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>',
search:'<circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
bell:'<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
chev:'<path d="m1.5 1.5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
back:'<path d="M11 1.5 2 10.5l9 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
warn:'<path d="M12 4 2.5 20h19zM12 10v4.5M12 17.5v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>',
lock:'<rect x="5" y="11" width="14" height="9.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/>',
clock:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
store:'<path d="M4 9.5h16M5 9.5V20h14V9.5M3.5 9.5 5.5 4h13l2 5.5M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
check:'<path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
people:'<circle cx="9" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M15.5 5.2a3.5 3.5 0 0 1 0 6.6M17.8 14.8c2 .7 3.3 2.4 3.7 5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
phone:'<path d="M5 3.5h3.5l1.5 4.5-2.2 1.5a11 11 0 0 0 6.7 6.7l1.5-2.2 4.5 1.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.1 1.5 1.5 0 0 1 5 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
mail:'<rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
tag:'<path d="M3.5 12.5V4h8.5l8.5 8.5-8.5 8.5zM8 8.5v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'};
const svg=(k,vb='0 0 24 24')=>`<svg ${k==='chev'?'class="chev"':''} viewBox="${k==='chev'?'0 0 8 13':k==='back'?'0 0 13 21':vb}">${I[k]}</svg>`;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(e,p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},k,b64(e.ct))))}
const tap=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
let D=null,ST={tab:'home',store:'all',per:'30d',stack:[],q:'',fs:'all',cq:'',cs:'all',cst:'all',sort:'recent',lim:60};
const TABS=[['home','Overview','home'],['funnel','Funnel','funnel'],['tests','Tests','tests'],['customers','Customers','people'],['search','Codes','search'],['alerts','Alerts','bell']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fphone=p=>{p=String(p||'').replace(/\D/g,'');if(p.length==11&&p[0]=='1')p=p.slice(1);return p.length==10?`(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`:p};
const STORES=[['all','Both'],['stpeters','SNOCRAVE'],['ellisville','SNOFIX']],PERS=[['today','Today'],['7d','7D'],['30d','30D'],['ytd','YTD'],['all','All']];
const PL={today:'today','7d':'last 7 days','30d':'last 30 days',ytd:'year to date',all:'all time'};
const n=v=>v==null?'—':Number(v).toLocaleString(),$=v=>v==null?'—':'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:v>=1000?0:2,maximumFractionDigits:v>=1000?0:2}),
 pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'—',ts=s=>s?`20${s.slice(0,2)}-${s.slice(2,4)}-${s.slice(4,6)} ${s.slice(7,9)}:${s.slice(9,11)}`:'—';
async function load(p){const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});return decrypt(await r.json(),p)}
async function unlock(){const p=document.getElementById('pw').value,b=document.getElementById('ubtn');b.innerHTML=`<svg class="spin" viewBox="0 0 24 24" width="16">${I.refresh}</svg>`;
 try{D=await load(p);localStorage.setItem('ice_pw',p);opened()}catch(e){tap();b.textContent='Unlock';document.getElementById('lerr').textContent='Incorrect passcode';const f=document.getElementById('pw');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');f.value=''}}
function opened(){document.getElementById('lock').classList.add('gone');render()}
function lockApp(){localStorage.removeItem('ice_pw');location.reload()}
async function refresh(){tap();const b=document.getElementById('rbtn');b.querySelector('svg')?.classList.add('spin');skeleton();
 try{if(!window.PREVIEW_DATA)D=await load(localStorage.getItem('ice_pw'));}catch(e){}setTimeout(()=>render(),window.PREVIEW_DATA?500:0)}
function skeleton(){document.getElementById('views').innerHTML=`<div class="view"><div class="sk" style="height:26px;margin-bottom:8px"></div>${[60,90,140].map(h=>`<div class="sk" style="height:${h}px;margin-bottom:10px"></div>`).join('')}</div>`}
const seg=(key,opts)=>`<div class="seg">${opts.map(([k,l])=>`<button class="${ST[key]==k?'on':''}" onclick="tap();ST.${key}='${k}';render(true)">${l}</button>`).join('')}</div>`;
const li=(o)=>`<button class="li press ${o.ic?'ico':''}" ${o.on?`onclick="${o.on}"`:''}>${o.ic?`<span class="sq" style="color:${o.c||'var(--l2)'}">${svg(o.ic)}</span>`:''}<span class="grow"><div class="t1">${o.t}</div>${o.s?`<div class="t2">${o.s}</div>`:''}</span>${o.v!=null?`<span class="val num">${o.v}</span>`:''}${o.on?svg('chev'):''}</button>`;
function go(tab){tap();ST.tab=tab;ST.stack=[];window.scrollTo(0,0);render()}
function push(v){tap();ST.stack.push(v);window.scrollTo(0,0);render()}
function pop(){tap();ST.stack.pop();render()}
function render(keep){if(!D)return;const top=ST.stack[ST.stack.length-1];let title,html;
 if(top){[title,html]=VIEWS[top.v](top)}else{[title,html]=VIEWS[ST.tab]()}
 document.getElementById('big').textContent=title;document.getElementById('navT').textContent=title;
 document.getElementById('navL').innerHTML=top?`<button class="back press" onclick="pop()">${svg('back')}${ST.stack.length>1?'Back':TABS.find(t=>t[0]==ST.tab)[1]}</button>`:'';
 document.getElementById('rbtn').innerHTML=svg('refresh');
 document.getElementById('views').innerHTML=`<div class="view ${top&&!keep?'push':''}" style="${keep?'animation:none':''}">${html}</div>`;
 const al=D.stores.all.alerts.length;document.getElementById('tabs').innerHTML=TABS.map(([k,l,i])=>`<button class="tab ${ST.tab==k?'on':''}" onclick="go('${k}')">${svg(i)}${k=='alerts'&&al?`<span class="badge">${al}</span>`:''}<span>${l}</span></button>`).join('');
 if(ST.tab=='search'&&!top){const q=document.getElementById('q');if(q&&keep){q.focus();q.setSelectionRange(99,99)}}}
const spk=(a,c='var(--ac)')=>{const mx=Math.max(1,...a),w=100,h=18,p=a.map((v,i)=>`${(i*w/(a.length-1)).toFixed(1)},${(h-1-(h-2)*v/mx).toFixed(1)}`).join(' ');return`<svg class="spk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`};
const wow=(w,k)=>{const a=w[w.length-2]?.[k]||0,b=w[w.length-3]?.[k]||0;if(!a&&!b)return'<span class="d eq">—</span>';if(!b)return'<span class="d up">new</span>';const d=(a-b)/b*100;return`<span class="d ${d>0.5?'up':d<-0.5?'dn':'eq'}">${d>0?'+':''}${d.toFixed(0)}%</span>`};

// nav shadow + pull to refresh
addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',scrollY>30),{passive:true});
let y0=null;const ptr=document.getElementById('ptr');
addEventListener('touchstart',e=>{y0=scrollY<=0?e.touches[0].clientY:null},{passive:true});

addEventListener('touchend',()=>{if(y0==null)return;const h=parseFloat(ptr.style.height)||0;ptr.style.transition='';y0=null;
